# =============================================================================
# Scale-up data preprocessing config
# =============================================================================
# Same schema as default.yaml. Use this once your labeled dataset is >100 pairs.
# Notes explain WHY each knob differs from the small-data default.
# =============================================================================

masking:
  # With more, cleaner .ang files, you can afford a stricter CI cutoff.
  # This reduces label noise at the cost of ~5-10% "unindexed" pixels per map.
  ci_threshold: 0.15

  iq_threshold: 30.0           # optional additional IQ filter, safe with many samples

  apply_median_filter: true
  median_filter_size: 3
  dilate_unindexed: true
  unindexed_dilation_pixels: 2  # larger safety margin, since we can spare pixels

  ferrite_names:   ["Ferrite", "Iron bcc", "Iron (Alpha)", "Alpha-Iron", "δ-Ferrite"]
  austenite_names: ["Austenite", "Iron fcc", "Iron (Gamma)", "Gamma-Iron"]
  sigma_names:     ["Sigma", "σ"]

  ferrite_class_id: 1
  austenite_class_id: 0
  sigma_class_id: 2

  # Turn on 3-class mode once you have >=20 samples with visible sigma.
  three_class_mode: true

registration:
  method: "auto"
  min_orb_inliers: 30          # stricter threshold — you can afford to reject and revisit
  min_ecc_score: 0.6
